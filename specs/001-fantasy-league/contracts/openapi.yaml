openapi: 3.1.0
info:
  title: Dodgeball Fantasy League API
  version: 1.0.0
  description: REST API for managing dodgeball fantasy league with player generation, team drafting, and game simulation

servers:
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: leagues
    description: League management operations
  - name: players
    description: Player management operations
  - name: teams
    description: Team management operations
  - name: games
    description: Game simulation and history

paths:
  /leagues:
    post:
      tags: [leagues]
      summary: Create a new league
      operationId: createLeague
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Elite Dodgeball League"
                player_count:
                  type: integer
                  minimum: 50
                  maximum: 100
                  default: 75
      responses:
        '201':
          description: League created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '400':
          $ref: '#/components/responses/BadRequest'

  /leagues/{league_id}:
    get:
      tags: [leagues]
      summary: Get league details
      operationId: getLeague
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '200':
          description: League details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '404':
          $ref: '#/components/responses/NotFound'

  /leagues/{league_id}/players:
    post:
      tags: [leagues, players]
      summary: Generate players for the league
      operationId: generatePlayers
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '201':
          description: Players generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
    
    get:
      tags: [leagues, players]
      summary: List all players in league
      operationId: listPlayers
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: free_agents_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'

  /players/{player_id}:
    get:
      tags: [players]
      summary: Get player details
      operationId: getPlayer
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: Player details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams:
    post:
      tags: [teams]
      summary: Create a new team
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, league_id]
              properties:
                name:
                  type: string
                  example: "Thunder Dodgers"
                description:
                  type: string
                  example: "Fast and furious team"
                logo:
                  type: string
                  example: "logo-placeholder-1"
                league_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'

  /teams/{team_id}:
    get:
      tags: [teams]
      summary: Get team details
      operationId: getTeam
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams/{team_id}/players:
    post:
      tags: [teams]
      summary: Add player to team roster
      operationId: addPlayerToTeam
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_id]
              properties:
                player_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Player added to roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Conflict - budget exceeded or roster full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /teams/{team_id}/players/{player_id}:
    delete:
      tags: [teams]
      summary: Remove player from team roster
      operationId: removePlayerFromTeam
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: Player removed from roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams/{team_id}/starters:
    patch:
      tags: [teams]
      summary: Designate starting lineup
      operationId: setStarters
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starter_ids]
              properties:
                starter_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 5
                  maxItems: 5
      responses:
        '200':
          description: Starters updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'

  /games:
    post:
      tags: [games]
      summary: Create and simulate a game
      operationId: simulateGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [league_id, team1_id, team2_id]
              properties:
                league_id:
                  type: string
                  format: uuid
                team1_id:
                  type: string
                  format: uuid
                team2_id:
                  type: string
                  format: uuid
                seed:
                  type: integer
                  description: Random seed for deterministic simulation
      responses:
        '201':
          description: Game simulated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
    
    get:
      tags: [games]
      summary: List games (history)
      operationId: listGames
      parameters:
        - name: league_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'

  /games/{game_id}:
    get:
      tags: [games]
      summary: Get game details
      operationId: getGame
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Game details with play-by-play
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          $ref: '#/components/responses/NotFound'

  /leagues/{league_id}/standings:
    get:
      tags: [leagues]
      summary: Get league standings
      operationId: getStandings
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '200':
          description: Team standings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    team_id:
                      type: string
                      format: uuid
                    team_name:
                      type: string
                    wins:
                      type: integer
                    losses:
                      type: integer
                    rank:
                      type: integer

  /leagues/{league_id}/schedule:
    post:
      tags: [leagues]
      summary: Generate league schedule
      operationId: generateSchedule
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rounds:
                  type: integer
                  default: 1
                  minimum: 1
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  games_scheduled:
                    type: integer
                  schedule:
                    type: array
                    items:
                      type: object
                      properties:
                        game_number:
                          type: integer
                        team1_id:
                          type: string
                        team2_id:
                          type: string

components:
  parameters:
    LeagueId:
      name: league_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    PlayerId:
      name: player_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    GameId:
      name: game_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Player:
      type: object
      required: [id, name, age, avatar, skills, value, stats]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        age:
          type: integer
          minimum: 18
        avatar:
          type: string
        skills:
          type: object
          required: [catching, throwing, dodging, speed, iq, luck]
          properties:
            catching:
              type: integer
              minimum: 0
              maximum: 100
            throwing:
              type: integer
              minimum: 0
              maximum: 100
            dodging:
              type: integer
              minimum: 0
              maximum: 100
            speed:
              type: integer
              minimum: 0
              maximum: 100
            iq:
              type: integer
              minimum: 0
              maximum: 100
            luck:
              type: integer
              minimum: 0
              maximum: 100
        value:
          type: integer
          minimum: 0
        injury:
          type: object
          nullable: true
          properties:
            severity:
              type: string
              enum: [minor, moderate, severe]
            affected_reduction:
              type: number
              format: float
            games_remaining:
              type: integer
        stats:
          type: object
          properties:
            throws_attempted:
              type: integer
            catches_made:
              type: integer
            times_hit:
              type: integer
            missed_throws:
              type: integer
            successful_hits:
              type: integer
        team_id:
          type: string
          format: uuid
          nullable: true
        is_starter:
          type: boolean

    Team:
      type: object
      required: [id, name, description, logo, budget, player_ids, starter_ids, wins, losses]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        logo:
          type: string
        budget:
          type: integer
          minimum: 0
          maximum: 100000
        player_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
          maxItems: 12
        starter_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5
        wins:
          type: integer
        losses:
          type: integer
        awards:
          type: array
          items:
            type: string
        league_id:
          type: string
          format: uuid

    League:
      type: object
      required: [id, name, settings, team_ids, game_ids]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        settings:
          type: object
          properties:
            player_count:
              type: integer
              minimum: 50
              maximum: 100
            season_rounds:
              type: integer
        team_ids:
          type: array
          items:
            type: string
            format: uuid
        game_ids:
          type: array
          items:
            type: string
            format: uuid
        schedule:
          type: array
          items:
            type: object
            properties:
              game_number:
                type: integer
              team1_id:
                type: string
              team2_id:
                type: string
              completed:
                type: boolean
        created_at:
          type: string
          format: date-time

    Game:
      type: object
      required: [id, league_id, team1_id, team2_id, events]
      properties:
        id:
          type: string
          format: uuid
        league_id:
          type: string
          format: uuid
        team1_id:
          type: string
          format: uuid
        team2_id:
          type: string
          format: uuid
        team1_starters:
          type: array
          items:
            type: string
            format: uuid
        team2_starters:
          type: array
          items:
            type: string
            format: uuid
        events:
          type: array
          items:
            type: object
            properties:
              turn:
                type: integer
              type:
                type: string
                enum: [throw, hit, catch, miss, elimination]
              thrower_id:
                type: string
              target_id:
                type: string
              outcome:
                type: string
        winner_id:
          type: string
          format: uuid
        completed_at:
          type: string
          format: date-time
        seed:
          type: integer

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        detail:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
